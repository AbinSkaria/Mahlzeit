<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mahlzeit! · THWS lunch matching{% endblock %}</title>
  <meta name="description" content="Lunch for four: two students new to Germany, two who know their way around. A THWS Fit4Germany project.">
  <!-- No external fonts or trackers: Google Fonts loaded from Google's servers
       transfers visitor IPs to the US (LG München, 2022). System fonts only. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23d9502f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23d9502f' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      Mahlzeit!
    </a>
    <nav>
      {% if user %}
        {% if is_admin(user) %}<a href="/admin" class="nav-link">Admin</a>{% endif %}
        <a href="/home" class="nav-link">My lunches</a>
        <form method="post" action="/logout" class="inline-form">
          <button type="submit" class="nav-link as-link">Log out</button>
        </form>
      {% else %}
        <a href="/login" class="nav-link">Log in</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>A <strong>Fit4Germany</strong> project at THWS</span>
    <a href="/privacy">Privacy</a>
  </footer>
</body>
</html>
